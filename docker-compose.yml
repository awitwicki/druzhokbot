services:
  druzhokbot:
    image: druzhokbot
    container_name: druzhokbot-container
    build:
      context: .
      dockerfile: DruzhokBot.App/Dockerfile
    env_file:
      - .env
    environment:
      - DRUZHOKBOT_DB_PATH=/app/data/druzhokbot.db
    volumes:
      - druzhokbot-data:/app/data
    restart: always
    network_mode: host

volumes:
  druzhokbot-data:
    name: druzhokbot-data
